name: scanner_app
description: Offline document and ID card scanner (CamScanner-style).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management (Milestone 1)
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Scanning & storage (Milestone 1)
  google_mlkit_document_scanner: ^0.4.0
  path_provider: ^2.1.5
  path: ^1.9.1

  # PDF creation (Milestone 1 — ID A4 + multi-page)
  syncfusion_flutter_pdf: ^28.2.12

  # OCR & PDF tools (Milestone 2)
  google_mlkit_text_recognition: ^0.15.0
  file_picker: ^8.3.7
  signature: ^5.5.0

  # Advanced PDF tools & app lock (Milestone 3)
  pdfrx: ^1.1.32
  flutter_image_compress: ^2.4.0
  local_auth: ^2.3.0
  shared_preferences: ^2.5.3
  image: ^4.5.4

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  lucide_icons: ^0.257.0
  camera: ^0.12.0+2
  # 13.x pulls permission_handler_android 14.x (broken .kts on AGP 8 / non-built-in Kotlin).
  permission_handler: 11.3.1
  image_picker: ^1.2.3
  opencv_dart: ^2.2.2
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Riverpod code generation
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5

flutter:
  uses-material-design: true
